<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aria2ng-next Connect</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 20px; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; }
  input[type=text], input[type=password], input[type=number] {
    width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #bbb; border-radius: 8px; font: inherit;
  }
  .row { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
  button { padding: 8px 18px; border: 0; border-radius: 8px; background: #4f6df5; color: #fff; font: inherit; cursor: pointer; }
  button.ghost { background: #e8eaf6; color: #1a1a1a; }
  #status { margin-top: 14px; padding: 10px 12px; border-radius: 8px; background: #f3f4f6; white-space: pre-wrap; }
  .hint { color: #666; font-size: 13px; }
  .warn { color: #c62828; }
</style>
</head>
<body>
<h1>aria2ng-next Connect</h1>
<p class="hint" id="hint"></p>

<label for="apiBase">API endpoint</label>
<input id="apiBase" type="text" placeholder="http://127.0.0.1:6902">
<p class="hint warn" id="warn"></p>

<label for="token">Token</label>
<input id="token" type="password" placeholder="from app Settings → Browser extension" autocomplete="off">

<label for="minBytes">Min size to intercept (bytes, 0 = all)</label>
<input id="minBytes" type="number" min="0" value="0">

<div class="row"><input id="enabled" type="checkbox"><label for="enabled" style="margin:0">Enable extension API</label></div>
<div class="row"><input id="intercept" type="checkbox"><label for="intercept" style="margin:0">Intercept browser downloads</label></div>

<div class="row">
  <button id="save">Save</button>
  <button id="test" class="ghost">Test connection</button>
</div>
<div id="status"></div>

<script src="options.js"></script>
</body>
</html>
