<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.4 system-ui, sans-serif; width: 320px; margin: 0; padding: 10px 12px; }
  h2 { font-size: 14px; margin: 0 0 8px; display: flex; justify-content: space-between; }
  h2 a { font-weight: 400; font-size: 12px; }
  #stat { color: #555; margin-bottom: 8px; }
  .task { border-top: 1px solid #e5e5e5; padding: 7px 0; }
  .task .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .task .meta { color: #666; display: flex; justify-content: space-between; align-items: center; }
  .task .bar { height: 4px; background: #eee; border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .task .bar i { display: block; height: 100%; background: #4f6df5; }
  .task button { border: 0; background: none; cursor: pointer; font-size: 14px; padding: 0 4px; }
  #err { color: #b00020; white-space: pre-wrap; }
  .empty { color: #888; padding: 12px 0; text-align: center; }
</style>
</head>
<body>
<h2>aria2ng-next <a href="#" id="opts">settings</a></h2>
<div id="stat"></div>
<div id="err"></div>
<div id="tasks"></div>
<script src="popup.js"></script>
</body>
</html>
