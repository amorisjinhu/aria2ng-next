# Daemon heap capped (was -Xmx4g → ~4GB resident per daemon). Metaspace cap
# stops class-loader growth across repeated builds.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
# Exit the daemon 60s after the last build instead of the 3h default — the
# "JDK never ends after a run" memory creep was the idle daemon lingering.
# Set org.gradle.daemon=false instead if you want a guaranteed exit per run
# (cold builds, slower iteration).
org.gradle.daemon.idletimeout=60000
# Kotlin compile daemon is the SECOND OpenJDK process — cap it too.
kotlin.daemon.jvmargs=-Xmx1g
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
